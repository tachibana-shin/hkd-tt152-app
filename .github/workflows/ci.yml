name: CI

# Kiểm tra mọi thay đổi trước khi đóng gói: frontend (typecheck + lint + format
# + build) và Rust (fmt + clippy + test). Bộ `.sqlx` được commit nên build Rust
# chạy offline, không cần database.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck · lint · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Kiểu dữ liệu (vue-tsc)
        run: bun run typecheck
      - name: Lint (oxlint)
        run: bunx oxlint
      - name: Định dạng (oxfmt)
        run: bunx oxfmt --check
      # semantic-release ghi phiên bản vào cả 4 file manifest rồi commit; bước này
      # chặn trường hợp ai đó sửa tay một file (hoặc quên commit) làm bundle lệch
      # với tag đã phát hành.
      - name: Phiên bản khớp tag
        run: node scripts/set-version.mjs --check
      - name: Build
        run: bun run vite build

  rust:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> src-tauri/target"
      - name: Deps hệ thống cho Tauri (webkit)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential libssl-dev
      - name: Định dạng (cargo fmt)
        run: cargo fmt --all --check --manifest-path Cargo.toml
      - name: Lint (cargo clippy)
        run: cargo clippy --workspace --manifest-path Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --manifest-path Cargo.toml --lib

  sqlx:
    name: .sqlx khớp truy vấn
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> src-tauri/target"
      - name: Deps hệ thống cho Tauri (webkit)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential libssl-dev
      # Cài sqlx-cli bằng cargo: không phụ thuộc action bên thứ ba (tag tool của
      # taiki-e/install-action dễ đổi tên theo phiên bản).
      - name: Cài sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features sqlite
      - name: Kiểm tra bộ cache truy vấn còn mới
        run: |
          cd src-tauri
          rm -f sqlx-prep.db
          for f in $(ls migrations/*.sql | sort); do sqlite3 sqlx-prep.db < "$f"; done
          # Đường dẫn tuyệt đối: khi workspace root là gốc repo, đường dẫn tương
          # đối resolve theo chỗ cargo thay vì src-tauri/ → sqlite mở nhầm chỗ.
          DATABASE_URL="sqlite:$(pwd)/sqlx-prep.db" SQLX_OFFLINE=false \
            cargo sqlx prepare --workspace --check -- --all-targets

  e2e:
    name: E2E (Playwright, offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> src-tauri/target"
      - name: Deps hệ thống cho Tauri + trình duyệt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential libssl-dev xvfb libnss3 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      # App chạy `tauri dev` nên cần màn hình ảo (Xvfb) trên runner không GUI.
      - name: Chạy E2E
        run: xvfb-run -a bunx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
