name: Release

# Đóng gói đa nền tảng theo phiên bản do semantic-release tính từ commit.
#
# Luồng: commit vào `main` → semantic-release tính bản mới (feat→minor, fix→patch,
# ! → major) và tạo tag v… → job đóng gói build 6 target rồi gắn asset vào Release.
#
# Secrets cần cấu hình trong repo (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY        khoá ký OTA (nội dung file .tauri/*.key, base64 hoặc nguyên văn)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD mật khẩu khoá (để trống nếu khoá không mật khẩu)
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / KEYCHAIN_PASSWORD  (bản macOS có ký)
#   APPLE_ID / APPLE_TEAM_ID / APPLE_PASSWORD   (không bắt buộc: chỉ dùng cho notarize)
# Thiếu secret ký macOS thì job macOS vẫn build được nhưng app chưa ký — chỉ chạy
# được sau khi bấm "Bỏ qua" trong Gatekeeper.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Đóng gói bản cụ thể (bỏ trống thì để semantic-release tự tính)"
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  semantic:
    name: Tính phiên bản (semantic-release)
    # Chỉ định version khi chạy tay → bỏ qua semantic-release.
    if: ${{ inputs.version == '' }}
    runs-on: ubuntu-latest
    # semantic-release tự tạo tag, đẩy CHANGELOG.md và mở/nhãn Release → cần quyền ghi.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.semantic.outputs.version }}
      release_id: ${{ steps.semantic.outputs.release_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          branch: main
          # Đúng tên input của action (snake_case). Mặc định `unset_gha_env: true`
          # khiến action KHÔNG xuất `version`/`release_id` → job đóng gói bị bỏ qua.
          tag_format: "v${version}"
          unset_gha_env: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package:
    name: ${{ matrix.label }}
    needs: semantic
    # Luôn chạy: phiên bản lấy ở bước dưới — từ input khi chạy tay, nếu không
    # thì từ tag v* mới nhất do semantic-release vừa đẩy lên (nguồn sự thật,
    # không phụ thuộc output của action).
    if: ${{ always() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64 (NSIS + MSI)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis,msi
          - label: Windows ARM64 (NSIS)
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            args: --bundles nsis
          - label: macOS Intel (dmg)
            os: macos-13
            target: x86_64-apple-darwin
            args: --bundles dmg
          - label: macOS Apple Silicon (dmg)
            os: macos-14
            target: aarch64-apple-darwin
            args: --bundles dmg
          - label: Linux x64 (AppImage + deb)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --bundles appimage,deb
          - label: Linux ARM64 (AppImage)
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            args: --bundles appimage
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Deps Linux (webkit + đóng gói)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential libssl-dev rpm file

      - name: Xác định phiên bản
        id: ver
        env:
          INPUT: ${{ inputs.version }}
          NEEDED: ${{ needs.semantic.outputs.version }}
        run: |
          set -euo pipefail
          version="$INPUT"
          if [ -z "$version" ]; then
            # semantic-release vừa tạo tag: ưu tiên tag trùng version nó báo,
            # không có thì lấy tag v* mới nhất trên remote.
            if [ -n "$NEEDED" ]; then
              version="$NEEDED"
            else
              version=$(git ls-remote --tags origin 'v*' \
                | sed 's#.*refs/tags/v##' | sed 's/\^{}//' \
                | grep -E '^[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
            fi
          fi
          if [ -z "$version" ]; then
            echo "::error::Không xác định được phiên bản để đóng gói"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Đóng gói bản $version"

      # Version của bundle phải khớp tag, nên ghi vào cả 3 file manifest.
      - name: Ghi phiên bản
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: node scripts/set-version.mjs "$VERSION"

      # Nạp chứng thư ký macOS (không bắt buộc — thiếu secret thì build không ký).
      - name: Nạp chứng thư Apple
        if: startsWith(matrix.os, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::notice::Không có APPLE_CERTIFICATE — bản macOS sẽ KHÔNG ký chứng thư."
            exit 0
          fi
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-keychain-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep -E "Apple (Development|Distribution)" || true)
          echo "Apple identities: $CERT_INFO"
          CERT_ID=$(echo "$CERT_INFO" | head -1 | awk -F'"' '{print $2}')
          echo "CERT_ID=$CERT_ID" >> "$GITHUB_ENV"

      # `createUpdaterArtifacts: true` khiến `tauri build` FAIL nếu không có khoá
      # ký → bỏ qua đóng gói thay vì đốt 20 phút runner rồi đỏ.
      - name: Kiểm tra khoá ký OTA
        id: updaterkey
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Chưa có secret TAURI_SIGNING_PRIVATE_KEY — bỏ qua đóng gói. Thêm secret rồi chạy lại workflow Release."
          fi

      - name: Build & phát hành
        if: steps.updaterkey.outputs.available == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Bản macOS: dùng identity vừa nạp, bỏ trống thì build không ký.
          APPLE_SIGNING_IDENTITY: ${{ env.CERT_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        with:
          tagName: v${{ steps.ver.outputs.version }}
          releaseName: HKD Kế Toán v${{ steps.ver.outputs.version }}
          releaseBody: |
            Tải bản cài cho hệ điều hành của bạn ở phần Assets.

            Người dùng bản cài (.exe / .dmg / .AppImage) có thể cập nhật ngay
            trong app: Cài đặt → Cập nhật ứng dụng.
          # Rỗng khi chạy tay; tauri-action tự tìm/tạo Release theo tag.
          releaseId: ${{ needs.semantic.outputs.release_id }}
          releaseDraft: true
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          args: --target ${{ matrix.target }} ${{ matrix.args }}
