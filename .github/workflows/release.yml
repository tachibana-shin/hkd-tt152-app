name: Release

# Đóng gói đa nền tảng theo phiên bản do semantic-release tính từ commit.
#
# Luồng: commit vào `main` → semantic-release tính bản mới (feat→minor, fix→patch,
# ! → major) và tạo tag v… → job đóng gói build 6 target rồi gắn asset vào Release.
#
# Secrets cần cấu hình trong repo (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY        khoá ký OTA (nội dung file .tauri/*.key, base64 hoặc nguyên văn)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD mật khẩu khoá (để trống nếu khoá không mật khẩu)
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / KEYCHAIN_PASSWORD  (bản macOS có ký)
#   APPLE_ID / APPLE_TEAM_ID / APPLE_PASSWORD   (không bắt buộc: chỉ dùng cho notarize)
# Thiếu secret ký macOS thì job macOS vẫn build được nhưng app chưa ký — chỉ chạy
# được sau khi bấm "Bỏ qua" trong Gatekeeper.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Đóng gói bản cụ thể (bỏ trống thì để semantic-release tự tính)"
        required: false
        type: string

concurrency:
  group: release-${{ github.repository }}
  # CHỈ huỷ khi có commit MỚI trên main. Nếu bật luôn, một lần chạy tay
  # (workflow_dispatch) sẽ tự huỷ chính nó ngay khi semantic-release tạo
  # commit release trên main.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  semantic:
    name: Tính phiên bản (semantic-release)
    # Chỉ định version khi chạy tay → bỏ qua semantic-release.
    if: ${{ inputs.version == '' }}
    runs-on: ubuntu-latest
    # semantic-release tự tạo tag, đẩy CHANGELOG.md và mở/nhãn Release → cần quyền ghi.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      # Tắt hook husky: commit của semantic-release chạy pre-commit → `cargo
      # clippy` → cần system dep (webkit/gtk) mà runner này không có, job đỏ
      # sau khi đã tính xong phiên bản. Code đã qua job `frontend` + `rust` ở CI.
      HUSKY: "0"
    outputs:
      released: ${{ steps.result.outputs.released }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Cần TOÀN BỘ lịch sử: semantic-release đọc commit từ tag trước đó.
          fetch-depth: 0
      # Node 24: semantic-release 25 yêu cầu ^22.14 || >=24.10 (bản cài trong
      # devDependencies). Action `cycjimmy/semantic-release-action` từng không
      # đọc `.releaserc.json` nên không sinh changelog/bump version — gọi CLI
      # trực tiếp để đúng cấu hình trong repo.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Tag mới nhất TRƯỚC khi semantic-release chạy — để biết nó có tạo bản mới
      # hay không (commit kiểu docs/chore/test không kích hoạt release).
      - name: Tag trước khi phát hành
        id: before
        run: echo "tag=$(git tag --list 'v*' --sort=-v:refname | head -1)" >> "$GITHUB_OUTPUT"
      - name: semantic-release
        # Cài đặt của 7 plugin trong .releaserc.json nằm trong devDependencies
        # nên bước `bun install` trên là đủ — không cài bằng action bên thứ ba.
        run: npx --no-install semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # semantic-release đẩy tag lên remote nên phải fetch về mới thấy.
      - name: Có bản phát hành mới không
        id: result
        run: |
          git fetch --tags --force --quiet
          newest=$(git tag --list 'v*' --sort=-v:refname | head -1)
          echo "Bản mới nhất: $newest (trước đó: ${{ steps.before.outputs.tag }})"
          if [ -z "$newest" ] || [ "$newest" = "${{ steps.before.outputs.tag }}" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Không có thay đổi nào đáng phát hành (chỉ docs/chore/test) — bỏ qua đóng gói."
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

  package:
    name: ${{ matrix.label }}
    needs: semantic
    # Chạy khi có bản mới (semantic-release vừa tạo tag) hoặc khi chạy tay chỉ định
    # version. Commit chỉ đổi docs/chore/test sẽ KHÔNG đóng gói lại — không có gì
    # để phát hành thì đốt 6 runner là phí phạm.
    if: ${{ always() && (inputs.version != '' || needs.semantic.outputs.released == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64 (NSIS + MSI)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis,msi
          - label: Windows ARM64 (NSIS)
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            args: --bundles nsis
          - label: macOS Intel (dmg)
            os: macos-15-intel
            target: x86_64-apple-darwin
            args: --bundles dmg
          - label: macOS Apple Silicon (dmg)
            os: macos-14
            target: aarch64-apple-darwin
            args: --bundles dmg
          - label: Linux x64 (AppImage + deb)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --bundles appimage,deb
          - label: Linux ARM64 (AppImage)
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            args: --bundles appimage
    runs-on: ${{ matrix.os }}
    # Runner ARM chưa bật sẽ treo vô hạn và giữ khoá concurrency của cả workflow
    # → giới hạn thời gian để job tự bỏ, workflow không bị kẹt.
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # @tauri-apps/cli nằm trong devDependencies — thiếu bước này thì lệnh
      # `tauri build` của tauri-action sẽ không tìm thấy.
      - run: bun install --frozen-lockfile
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Deps Linux (webkit + đóng gói)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential libssl-dev rpm file

      - name: Xác định phiên bản
        id: ver
        # Runner Windows mặc định dùng PowerShell — script dưới đây là bash.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$INPUT"
          if [ -z "$version" ]; then
            # Tag v* mới nhất trên remote là nguồn sự thật: semantic-release vừa
            # tạo tag ở job trước (hoặc tag đã có sẵn khi chạy tay).
            version=$(git ls-remote --tags origin 'v*' \
              | sed 's#.*refs/tags/v##' | sed 's/\^{}//' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
          fi
          if [ -z "$version" ]; then
            echo "::error::Không xác định được phiên bản để đóng gói"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Release do semantic-release tạo (draft) sẽ gắn asset vào; nếu
          # chạy tay với version mới thì chưa có → để tauri-action tự tạo.
          rid=$(gh release view "v$version" --json databaseId --jq .databaseId 2>/dev/null || true)
          if [ -n "$rid" ]; then
            echo "release_id=$rid" >> "$GITHUB_OUTPUT"
            echo "Gắn asset vào release v$version có sẵn (id $rid)"
          else
            echo "release_id=" >> "$GITHUB_OUTPUT"
            echo "Chưa có release v$version — tauri-action sẽ tạo mới"
          fi
          echo "Đóng gói bản $version"

      # Version của bundle phải khớp tag, nên ghi vào cả 3 file manifest.
      - name: Ghi phiên bản
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: node scripts/set-version.mjs "$VERSION"

      # Nạp chứng thư ký macOS (không bắt buộc — thiếu secret thì build không ký).
      - name: Nạp chứng thư Apple
        if: startsWith(matrix.os, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARY_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          # KHÔNG định nghĩa sẵn APPLE_ID/APPLE_TEAM_ID/APPLE_PASSWORD ở step build:
          # tauri-bundler kiểm `var_os(...)` — biến rỗng vẫn là Some("") nên nó vẫn
          # thử notarize rồi fail "Team ID must be at least 3 characters". Chỉ xuất
          # chúng ra GITHUB_ENV khi đủ cả 3 (không rỗng).
          if [ -n "$NOTARY_ID" ] && [ -n "$NOTARY_PASSWORD" ] && [ -n "$NOTARY_TEAM" ]; then
            {
              echo "APPLE_ID=$NOTARY_ID"
              echo "APPLE_PASSWORD=$NOTARY_PASSWORD"
              echo "APPLE_TEAM_ID=$NOTARY_TEAM"
            } >> "$GITHUB_ENV"
            echo "Sẽ notarize .dmg sau khi build."
          else
            echo "::notice::Không đủ APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID — bỏ qua notarize (app vẫn chạy được, Gatekeeper có thể phải bấm 'Mở')."
          fi

          # Không có chứng thư → ký ad-hoc (identity "-"). Truyền chuỗi rỗng cho
          # APPLE_SIGNING_IDENTITY sẽ khiến codesign tìm identity rỗng và fail.
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::notice::Không có APPLE_CERTIFICATE — build macOS ký ad-hoc (người dùng phải bấm 'Mở' khi mở app)."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-keychain-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep -E "Apple (Development|Distribution)" || true)
          echo "Apple identities: $CERT_INFO"
          CERT_ID=$(echo "$CERT_INFO" | head -1 | awk -F'"' '{print $2}')
          if [ -n "$CERT_ID" ]; then
            echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"
          else
            echo "::warning::Trong keychain không có identity — build macOS ký ad-hoc."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi

      # `createUpdaterArtifacts: true` khiến `tauri build` FAIL nếu không có khoá
      # ký → bỏ qua đóng gói thay vì đốt 20 phút runner rồi đỏ.
      - name: Kiểm tra khoá ký OTA
        id: updaterkey
        # Runner Windows mặc định dùng PowerShell — script dưới đây là bash.
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Chưa có secret TAURI_SIGNING_PRIVATE_KEY — bỏ qua đóng gói. Thêm secret rồi chạy lại workflow Release."
          fi

      - name: Build & phát hành
        if: steps.updaterkey.outputs.available == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # APPLE_ID / APPLE_TEAM_ID / APPLE_PASSWORD cố ý KHÔNG khai báo ở đây:
          # step "Nạp chứng thư Apple" chỉ xuất chúng ra GITHUB_ENV khi có thật.
        with:
          tagName: v${{ steps.ver.outputs.version }}
          # Rỗng khi chạy tay với bản mới; có sẵn thì gắn asset vào release do
          # semantic-release tạo.
          releaseId: ${{ steps.ver.outputs.release_id }}
          # Giữ draft: job `publish` mở công khai sau khi mọi target xong, và
          # chính job đó viết tiêu đề + nội dung Release.
          releaseDraft: true
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          args: --target ${{ matrix.target }} ${{ matrix.args }}

  # ─── Mở công khai release ───
  # semantic-release tạo release ở trạng thái draft, 6 job trên gắn asset vào.
  # Chỉ khi TẤT CẢ target thành công thì mới công khai: người dùng (và updater
  # đọc /releases/latest) không nhìn thấy bản thiếu file. Có target hỏng thì
  # để draft và in hướng dẫn — chạy lại workflow sau khi sửa.
  publish:
    name: Công khai release
    needs: [semantic, package]
    if: ${{ always() && needs.package.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Phiên bản cần công khai
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$INPUT"
          if [ -z "$version" ]; then
            version=$(git tag --list 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Viết nội dung & công khai
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # Read this version's entry from CHANGELOG.md (semantic-release already
          # pushed that commit to main). A manual run of an unreleased version has
          # no entry yet — the install section still goes out.
          {
            echo "### Tải bản cài"
            echo
            echo "Chọn đúng hệ điều hành ở phần **Assets** bên dưới."
            echo
            echo "Người dùng bản cài (\`.exe\` / \`.dmg\` / \`.AppImage\`) có thể cập nhật ngay trong app: **Cài đặt → Cập nhật ứng dụng**."
            echo
            # Extraction lives in a Node script rather than awk: semantic-release
            # writes `# [1.2.0]` for minor releases but `## [1.2.1]` for patches, so
            # a `^## [` pattern silently dropped the change list of every minor
            # release. The script accepts both heading levels.
            notes=$(node scripts/release-notes.mjs "$VERSION" || true)
            if [ -n "$notes" ]; then
              echo "$notes"
            fi
          } > release-notes.md
          gh release edit "v$VERSION" --draft=false \
            --title "HKD Kế Toán v$VERSION" --notes-file release-notes.md
          echo "Đã công khai release v$VERSION"
