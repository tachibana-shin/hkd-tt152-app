[package]
name = "hkd-tt152-app"
version = "0.17.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hkd_tt152_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
rand = "0.8"
chrono = "0.4"
# Trả PDF hóa đơn (base64) cho frontend qua IPC/HTTP.
base64 = "0.22"
# Tra cứu MST qua masothue.com (backend fetch để tránh CORS/Cloudflare)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
regex = "1"
# Web server local (127.0.0.1) — dùng app qua Chrome ở production.
axum = "0.8"
# Cổng HĐĐT: sinh header anti-bot `request-id` (UUID v4) cho mọi gọi API.
uuid = { version = "1", features = ["v4"] }
# Giải ZIP hồ sơ hóa đơn tải từ cổng (`…/invoices/export-xml`) lấy `invoice.xml`.
# Chỉ bật deflate (cổng nén deflate, backend zlib-rs như flate2 đang dùng);
# bỏ ciphers + nén khác (zopfli/bzip2/lzma/zstd/ppmd) cho gọn phụ thuộc.
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tauri-plugin-updater = "2.13.0"
tauri-plugin-process = "2.4.0"
# Hai gói tách ra ./packages — cùng workspace nên chỉ cần khai đường dẫn.
# Render PDF hóa đơn (htmltopdf + template tiếng Việt)…
invoice-pdf = { path = "../packages/invoice-pdf" }
# …và solver captcha cổng HĐĐT chạy offline.
hddt-captcha = { path = "../packages/hddt-captcha" }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# [profile.release] đã chuyển sang Cargo.toml ở gốc repo — profile chỉ có hiệu
# lực ở workspace root.
