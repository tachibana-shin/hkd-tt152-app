[package]
name = "hkd-tt152-app"
version = "0.15.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hkd_tt152_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
rand = "0.8"
chrono = "0.4"
# Tra cứu MST qua masothue.com (backend fetch để tránh CORS/Cloudflare)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
regex = "1"
# Web server local (127.0.0.1) — dùng app qua Chrome ở production.
axum = "0.8"
# Cổng HĐĐT: sinh header anti-bot `request-id` (UUID v4) cho mọi gọi API.
uuid = { version = "1", features = ["v4"] }
tauri-plugin-updater = "2.13.0"
tauri-plugin-process = "2.4.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
